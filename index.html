<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* 미션 시작 버튼 */
    #startButton {
      display: none;
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;

      padding: 16px 28px;
      font-size: 20px;
      font-weight: bold;

      background: #00a99d;
      color: white;

      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    /* 퀴즈 화면 */
    #quizBox {
      display: none;

      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 82%;
      max-width: 420px;

      background: white;
      padding: 25px;

      border-radius: 20px;

      z-index: 2000;

      text-align: center;

      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    #quizBox h2 {
      margin-top: 0;
      color: #00a99d;
    }

    .answerButton {
      width: 100%;

      padding: 14px;
      margin: 7px 0;

      font-size: 18px;

      background: #f2f2f2;

      border: 2px solid #ddd;
      border-radius: 12px;

      cursor: pointer;
    }

    #result {
      margin-top: 18px;

      font-size: 18px;
      font-weight: bold;

      line-height: 1.5;
    }

    #closeButton {
      display: none;

      margin-top: 15px;

      padding: 12px 20px;

      background: #333;
      color: white;

      border: none;
      border-radius: 10px;

      font-size: 16px;
    }
  </style>
</head>


<body>

<!-- 미션 시작 버튼 -->
<button id="startButton">
  MISSION START ▶
</button>


<!-- 퀴즈 -->
<div id="quizBox">

  <h2>MISSION 01</h2>

  <p>
    영종진이 지금의 영종도로<br>
    옮겨온 해는 언제일까요?
  </p>

  <button class="answerButton"
          onclick="checkAnswer(false)">
    ① 1443년
  </button>

  <button class="answerButton"
          onclick="checkAnswer(true)">
    ② 1653년
  </button>

  <button class="answerButton"
          onclick="checkAnswer(false)">
    ③ 1894년
  </button>

  <div id="result"></div>

  <button id="closeButton"
          onclick="closeQuiz()">
    게임으로 돌아가기
  </button>

</div>


<!-- AR -->
<a-scene

  mindar-image="imageTargetSrc: targets.mind;"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <!-- 이미지가 인식되면 실행 -->
  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <!-- 카드 위에 나타나는 AR 표시 -->
    <a-plane
      color="#00a99d"
      position="0 0 0"
      height="0.6"
      width="1.3">
    </a-plane>

    <a-text
      value="MISSION START!"
      color="white"
      align="center"
      position="0 0 0.01"
      width="2">
    </a-text>

  </a-entity>

</a-scene>


<script>

  const target =
    document.querySelector("#target");

  const startButton =
    document.querySelector("#startButton");

  const quizBox =
    document.querySelector("#quizBox");

  const result =
    document.querySelector("#result");

  const closeButton =
    document.querySelector("#closeButton");


  /* 카드가 인식되었을 때 */
  target.addEventListener("targetFound", () => {

    startButton.style.display = "block";

  });


  /* 카드 인식이 사라졌을 때 */
  target.addEventListener("targetLost", () => {

    if (quizBox.style.display !== "block") {

      startButton.style.display = "none";

    }

  });


  /* MISSION START 버튼 */
  startButton.addEventListener("click", () => {

    startButton.style.display = "none";

    quizBox.style.display = "block";

  });


  /* 정답 확인 */
  function checkAnswer(isCorrect) {

    if (isCorrect) {

      result.innerHTML =
        "🎉 MISSION CLEAR!<br><br>" +
        "1653년 효종 때 영종진이 이곳으로 옮겨왔어요.";

      result.style.color = "#008c7a";

      closeButton.style.display = "inline-block";

    }

    else {

      result.innerHTML =
        "아쉽다! 다시 한번 생각해봐.";

      result.style.color = "#d9534f";

    }

  }


  /* 퀴즈 닫기 */
  function closeQuiz() {

    quizBox.style.display = "none";

    result.innerHTML = "";

    closeButton.style.display = "none";

    startButton.style.display = "block";

  }

</script>

</body>
</html>
